name: Android APK
on:
  push: { paths: ["android/**", "autodiag_real/**", ".github/workflows/android.yml"] }
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Testy Python (desktop + Android bridge)
        run: pip install pytest && python -m pytest -q tests android/tests
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Klucz podpisu (stały)
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_B64 }}" }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > $RUNNER_TEMP/ks.jks; echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/ks.jks" >> $GITHUB_ENV; fi
      - name: Build APK (release, stały klucz)
        working-directory: android
        env: { ANDROID_KEYSTORE_PASS: "${{ secrets.ANDROID_KEYSTORE_PASS }}" }
        run: gradle --no-daemon assembleRelease && cp app/build/outputs/apk/release/app-release.apk AutoDiagPro-E39-1.3.4-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AutoDiagPro-E39-android-debug
          path: android/AutoDiagPro-E39-*.apk
